<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA 回退：404.html 把原路径存入 sessionStorage 后跳回首页，
         这里恢复真实路径（非 Pages 环境下 sessionStorage.redirect 为空，无副作用） -->
    <script>
      ;(function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== '/') {
          var base = document.baseURI.replace(/[^/]*$/, '')
          if (redirect.indexOf(base) === 0) redirect = redirect.slice(base.length) || '/'
          else if (redirect.charAt(0) === '/' && base.indexOf('//' + location.host + '/') > -1) {
            var hostRoot = '/' + base.split('//' + location.host + '/')[1] || '/'
            if (redirect.indexOf(hostRoot) === 0) redirect = redirect.slice(hostRoot.length) || '/'
          }
          if (redirect.charAt(0) === '/') history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F4EB" />
    <meta name="description" content="落叶物语——两个人的私密恋爱日记。把今天留在一片叶子里。" />
    <title>落叶物语 · 猴子大王与追落叶的恋爱日记</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
